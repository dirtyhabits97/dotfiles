# Ported from alacritty.toml; both terminals are kept side by side.
# No `term` here on purpose: TERM must stay kitty's default xterm-kitty, which
# vifm detects through tmux's #{client_termname}.

# Mono, unlike alacritty: kitty only accepts fonts macOS marks as monospace, and
# plain Hack Nerd Font isn't, so kitty would fall back to Menlo.
font_family      Hack Nerd Font Mono
font_size        16
background_opacity 0.9

# tmux is always running, so kitty would otherwise ask on every close.
confirm_os_window_close 0
shell_integration disabled

# Written by `bin/theme` — switch with e.g. `theme tokyo-night`.
include ~/.local/state/theme-kitty.conf

# The custom bindings from alacritty.toml; kitty's defaults cover the rest.
map alt+left   send_text all \x1bb
map alt+right  send_text all \x1bf
map ctrl+slash send_text all \x1f
