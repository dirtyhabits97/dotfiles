# vim:set ft=tmux:
# Sourced by claude-status.tmux; see the header there. Parsed when that `run`
# executes, i.e. after catppuccin has loaded, so %hidden is safe here.
%hidden MODULE_NAME="claude"

# #{W:#{P:...}} loops every pane of every window in the session the client is
# viewing and emits an "x" per match; #{n:} takes the string length, so the
# count costs no shell fork on each redraw. Wrap it in #{S:...} to count across
# all tmux sessions instead.
set -g @claude_open "#{n:#{W:#{P:#{?#{==:#{pane_current_command},claude},x,}}}}"
set -g @claude_waiting "#{n:#{W:#{P:#{?#{&&:#{==:#{pane_current_command},claude},#{@claude_wait}},x,}}}}"

set -g @catppuccin_claude_icon "󰚩 "
set -gF @catppuccin_claude_color "#{E:@thm_peach}"
set -g @catppuccin_claude_text " #{E:@claude_open}#{?#{!=:#{E:@claude_waiting},0}, #[fg=#{@thm_red}]✻ #{E:@claude_waiting}#[fg=#{@thm_fg}],}"

source -F "$HOME/.tmux/plugins/tmux/utils/status_module.conf"
