# NOTE: Run prefix + R to reload the tmux config

# MARK: General

# Start window numbers at 1 to match keyboard order
set -g base-index 1
set -g pane-base-index 1

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# Enable mouse scolling
set -g mouse on

# inspired from: https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/
# loud or quiet?
set  -g visual-activity   off
set  -g visual-bell       off
set  -g visual-silence    off
setw -g monitor-activity  off
set  -g bell-action       none

# increase scrollback lines
set -g history-limit 99999

# MARK: Colors

# Enables truecolor, to test run bin/truecolor.sh
set-option -sa terminal-overrides "xterm*:Tc"


# MARK: Keybinds

# Custom prefix
unbind C-b
set -g prefix C-y
bind C-y send-prefix

# Easier pane split
unbind-key s
bind 's' split-window -c "#{pane_current_path}"
unbind-key v
bind 'v' split-window -hc "#{pane_current_path}"


# MARK: Scripts
# prefix + i: ask Claude Code in a new window, rooted in the current pane's dir
bind i command-prompt -p "claude:" "neww -c '#{pane_current_path}' 'tmux-claude-query \"%%\"'"


# MARK: Plugins
# NOTE: Run `git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm`
# source: https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# NOTE: Pinned - the status modules change between releases (the `ram` module
# only exists from v2.3.0). Bump deliberately, then run prefix + U.
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Format the window indicator from "[1 | dotfiles]" to "(dotfiles | 1)"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position 'right'

# Respect the name given to the window by the user
set -g @catppuccin_window_default_fill "number"
# NOTE: The Claude Code hooks in claude/settings.json set @claude_wait on the
# *pane* running claude, so several sessions in one window each keep their own
# state. #{P:...} loops the window's panes and emits a "1" per waiting pane; the
# outer #{?...} collapses that to a single asterisk, so the flag stays up while
# any session is still waiting on you. A pane-scoped option dies with the pane,
# so a closed or killed session cannot leave the mark behind.
# set -g @catppuccin_window_text "#{window_name}"
set -g @catppuccin_window_text "#{?#{P:#{?@claude_wait,1,}},#[fg=#{@thm_red}]✻#[fg=default] ,}#{window_name}"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#{window_name}"

# Date format: Mon 08 Jul 16:03
set -g @catppuccin_date_time_text " %a %d %b %H:%M "

# MARK: Status bar

# Load catppuccin before the status line is assembled, otherwise the modules
# below expand to whatever the *previous* config load defined (tpm only runs at
# the bottom of this file), and a reload takes two passes to settle.
run '~/.tmux/plugins/tmux/catppuccin.tmux'
# Local plugin (tmux/claude-status/): Claude sessions open in this tmux
# session, plus a red ✻ count of the ones waiting on you. Not an @plugin -
# tpm only installs git repos, and `prefix + U` would `git pull` this repo.
run '~/.tmux/claude-status/claude-status.tmux'

set -g status-left ""
set -g status-right-length 100
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_claude}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
